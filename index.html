<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎵 Mi Setlist</title>
<link rel="stylesheet" href="./css/styles.css">
</head>

<body>

<header>
<h1>🎵 Mi Setlist</h1>
<p>Busca y organiza tu música</p>
</header>

<main>

<section class="busqueda">
<h2>🔎 Buscar canciones</h2>

<form id="form-busqueda">
<input id="input-busqueda" type="text" placeholder="Artista o canción">
<button type="submit">Buscar</button>
</form>

</section>

<div class="app">

<section class="contenido">
<h2>🎵 Resultados</h2>

<div id="resultados">
<p class="mensaje">Busca una canción para comenzar 🎧</p>
</div>

</section>


<aside>

<h2>🎧 Mis Playlists</h2>

<form id="form-playlist">
<input id="input-playlist" type="text" placeholder="Nombre playlist">
<button type="submit">Crear</button>
</form>

<div id="lista-playlists">
<p class="mensaje">No tienes playlists todavía</p>
</div>

</aside>

</div>

</main>

<script type="module" src="js/app.js"></script>

</body>
</html>
