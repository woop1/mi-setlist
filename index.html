<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎵 Mi Setlist</title>
  <link rel="stylesheet" href="./css/styles.css">
</head>

<body>

  <header>
    <h1>🎵 Mi Setlist</h1>
    <p>Busca tus canciones favoritas y crea tu playlist</p>
  </header>

  <main>

    <section>
      <h2>Buscar canciones</h2>

      <form id="form-busqueda">
        <input 
          id="input-busqueda"
          type="text"
          placeholder="Ejemplo: Soda Stereo"
        >

        <button type="submit">
          🔍 Buscar
        </button>
      </form>

    </section>

    <section>
      <h2>Resultados</h2>

      <div id="resultados">
        <p>Busca una canción para comenzar 🎵</p>
      </div>

    </section>

  </main>

  <script type="module" src="js/app.js"></script>

</body>
</html>
